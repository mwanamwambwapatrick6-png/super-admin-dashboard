version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: super-admin-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=super-secret-jwt-key
      - CORS_ORIGIN=http://localhost:5173
    networks:
      - admin-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: super-admin-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - admin-network

networks:
  admin-network:
    driver: bridge